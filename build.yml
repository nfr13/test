          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun HomeScreen(
              vms: List<VmConfig>,
              running: Set<String>,
              binaryOk: (Arch) -> Boolean,
              onAdd: () -> Unit,
              onEdit: (VmConfig) -> Unit,
              onDelete: (VmConfig) -> Unit,
              onStart: (VmConfig) -> Unit,
              onStop: (VmConfig) -> Unit,
              onConsole: (VmConfig) -> Unit,
          ) {
              val scroll = TopAppBarDefaults.exitUntilCollapsedScrollBehavior()

              Scaffold(
                  modifier = Modifier.nestedScroll(scroll.nestedScrollConnection),
                  topBar = {
                      LargeTopAppBar(
                          title = {
                              Column {
                                  Text("QemuLab")
                                  Text(
                                      if (running.isEmpty()) "${vms.size} mesin virtual"
                                      else "${running.size} berjalan · ${vms.size} mesin virtual",
                                      style = MaterialTheme.typography.bodyMedium,
                                      color = MaterialTheme.colorScheme.onSurfaceVariant,
                                  )
                              }
                          },
                          scrollBehavior = scroll,
                      )
                  },
                  floatingActionButton = {
                      ExtendedFloatingActionButton(
                          onClick = onAdd,
                          icon = { Icon(Icons.Filled.Add, contentDescription = null) },
                          text = { Text("VM baru") },
                      )
                  },
              ) { inner ->
                  if (vms.isEmpty()) {
                      EmptyState(Modifier.padding(inner).fillMaxSize())
                  } else {
                      LazyColumn(
                          modifier = Modifier.fillMaxSize(),
                          contentPadding = PaddingValues(
                              start = 16.dp, end = 16.dp,
                              top = inner.calculateTopPadding() + 8.dp,
                              bottom = inner.calculateBottomPadding() + 96.dp,
                          ),
                          verticalArrangement = Arrangement.spacedBy(12.dp),
                      ) {
                          items(vms, key = { it.id }) { vm ->
                              VmCard(
                                  vm = vm,
                                  isRunning = vm.id in running,
                                  binaryOk = binaryOk(vm.arch),
                                  onEdit = { onEdit(vm) },
                                  onDelete = { onDelete(vm) },
                                  onStart = { onStart(vm) },
                                  onStop = { onStop(vm) },
                                  onConsole = { onConsole(vm) },
                              )
                          }
                      }
                  }
              }
          }

          @Composable
          private fun VmCard(
              vm: VmConfig,
              isRunning: Boolean,
              binaryOk: Boolean,
              onEdit: () -> Unit,
              onDelete: () -> Unit,
              onStart: () -> Unit,
              onStop: () -> Unit,
              onConsole: () -> Unit,
          ) {
              // Bentuk lencana "morph" dari kotak membulat ke lingkaran saat VM berjalan (gerak pegas ala Expressive).
              val corner by animateDpAsState(
                  targetValue = if (isRunning) 28.dp else 16.dp,
                  animationSpec = spring(dampingRatio = Spring.DampingRatioMediumBouncy, stiffness = Spring.StiffnessLow),
                  label = "badgeCorner",
              )

              ElevatedCard(shape = RoundedCornerShape(32.dp), modifier = Modifier.fillMaxWidth()) {
                  Column(Modifier.padding(20.dp)) {
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Box(
                              Modifier
                                  .size(56.dp)
                                  .clip(RoundedCornerShape(corner))
                                  .background(
                                      if (isRunning) MaterialTheme.colorScheme.primary
                                      else MaterialTheme.colorScheme.secondaryContainer
                                  ),
                              contentAlignment = Alignment.Center,
                          ) {
                              Text(
                                  vm.arch.short,
                                  style = MaterialTheme.typography.labelLarge,
                                  fontWeight = FontWeight.Bold,
                                  color = if (isRunning) MaterialTheme.colorScheme.onPrimary
                                  else MaterialTheme.colorScheme.onSecondaryContainer,
                              )
                          }
                          Spacer(Modifier.width(16.dp))
                          Column(Modifier.weight(1f)) {
                              Text(vm.name, style = MaterialTheme.typography.titleLarge)
                              Text(
                                  "${vm.arch.label} · ${vm.cores} CPU · ${vm.ramMb} MB · ${vm.diskGb} GB",
                                  style = MaterialTheme.typography.bodyMedium,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant,
                              )
                              if (isRunning) {
                                  Text(
                                      "VNC 127.0.0.1:${vm.vncPort}",
                                      style = MaterialTheme.typography.labelMedium,
                                      color = MaterialTheme.colorScheme.primary,
                                  )
                              }
                          }
                          if (isRunning) CircularProgressIndicator(Modifier.size(32.dp), strokeWidth = 4.dp)
                      }

                      if (!binaryOk) {
                          Spacer(Modifier.height(12.dp))
                          Text(
                              "Binary QEMU ${vm.arch.label} belum disertakan di APK.",
                              style = MaterialTheme.typography.bodySmall,
                              color = MaterialTheme.colorScheme.error,
                          )
                      }

                      Spacer(Modifier.height(16.dp))
                      Row(
                          Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.spacedBy(8.dp),
                          verticalAlignment = Alignment.CenterVertically,
                      ) {
                          if (isRunning) {
                              FilledTonalButton(
                                  onClick = onStop,
                                  colors = ButtonDefaults.filledTonalButtonColors(
                                      containerColor = MaterialTheme.colorScheme.errorContainer,
                                      contentColor = MaterialTheme.colorScheme.onErrorContainer,
                                  ),
                              ) {
                                  Icon(Icons.Filled.Close, null, Modifier.size(18.dp))
                                  Spacer(Modifier.width(8.dp))
                                  Text("Hentikan")
                              }
                              OutlinedButton(onClick = onConsole) { Text("Konsol") }
                          } else {
                              Button(onClick = onStart) {
                                  Icon(Icons.Filled.PlayArrow, null, Modifier.size(18.dp))
                                  Spacer(Modifier.width(8.dp))
                                  Text("Jalankan")
                              }
                              OutlinedButton(onClick = onConsole) { Text("Log") }
                          }
                          Spacer(Modifier.weight(1f))
                          FilledTonalIconButton(onClick = onEdit, enabled = !isRunning) {
                              Icon(Icons.Filled.Edit, contentDescription = "Ubah")
                          }
                          IconButton(onClick = onDelete, enabled = !isRunning) {
                              Icon(Icons.Filled.Delete, contentDescription = "Hapus")
                          }
                      }
                  }
              }
          }

