name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write project files
        run: |
          set -e
          mkdir -p QemuLab
          cat > QemuLab/README.md <<'QLEOF'
          # QemuLab

          Frontend Android untuk menjalankan mesin virtual QEMU, dengan UI **Material 3 Expressive**
          (Jetpack Compose `material3:1.4.0` stabil): sudut sangat membulat, animasi pegas, warna dinamis.

          ## Cara build
          1. Buka folder ini di **Android Studio** (Ladybug atau lebih baru). Gradle wrapper dibuat otomatis saat sync.
          2. **Taruh binary QEMU** (lihat bawah), lalu `Build > Build APK(s)`.

          ## Binary QEMU (wajib)
          APK tidak bisa menjalankan VM tanpa binary QEMU untuk Android arm64. Aplikasi mencari binary di
          `nativeLibraryDir`, jadi namanya harus berawalan `lib` dan berakhiran `.so`:

          ```
          app/src/main/jniLibs/arm64-v8a/libqemu-system-x86_64.so    # qemu-system-x86_64
          app/src/main/jniLibs/arm64-v8a/libqemu-system-aarch64.so   # qemu-system-aarch64
          ```
          Jika QEMU kamu butuh library lain (glib, pixman, dll.), taruh juga di folder yang sama sebagai `lib*.so`
          (aplikasi sudah mengatur `LD_LIBRARY_PATH`). Binary bisa diambil dari build QEMU untuk Termux
          (`pkg install qemu-system-x86-64` lalu salin berkasnya) atau di-cross-compile dengan Android NDK.
          Pastikan lisensi GPL QEMU dipenuhi bila APK didistribusikan.

          Untuk VM ARM64, taruh firmware UEFI di `files/firmware/QEMU_EFI.fd` (di dalam data aplikasi).

          ## Cara pakai
          - **VM baru** → atur nama, arsitektur, RAM, CPU, ukuran disk (raw sparse), pilih ISO (disalin ke penyimpanan aplikasi).
          - **Jalankan** → QEMU dijalankan dengan `-vnc 127.0.0.1:N`. Sambungkan aplikasi klien VNC ke `127.0.0.1:590N`
            (port tampil di kartu VM). Output serial muncul di panel Konsol.

          ## Batasan saat ini
          - Belum ada viewer VNC bawaan; gunakan klien VNC eksternal.
          - Emulasi memakai TCG (tanpa KVM), jadi lambat. Jangan beri RAM terlalu besar.
          - Proses berjalan di proses aplikasi; Android bisa mematikannya saat di latar belakang
            (langkah berikutnya: foreground service).
          - Kode ini belum dikompilasi di lingkungan pembuatnya; kemungkinan perlu penyesuaian kecil pada
            nama API Material 3 Expressive bila versi library berbeda.
          QLEOF
          mkdir -p QemuLab/app
          cat > QemuLab/app/build.gradle.kts <<'QLEOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "id.qemulab"
              compileSdk = 35

              defaultConfig {
                  applicationId = "id.qemulab"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 2
                  versionName = "1.1.0"
                  ndk { abiFilters += listOf("arm64-v8a") }
              }

              buildTypes {
                  release { isMinifyEnabled = false }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }

              // Wajib: library native diekstrak ke nativeLibraryDir agar binary QEMU bisa dieksekusi.
              packaging { jniLibs { useLegacyPackaging = true } }
          }

          dependencies {
              val bom = platform("androidx.compose:compose-bom:2025.09.00")
              implementation(bom)
              implementation("androidx.compose.material3:material3:1.4.0")
              implementation("androidx.compose.material:material-icons-core")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.activity:activity-compose:1.10.1")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.9.0")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.9.0")
              implementation("androidx.core:core-ktx:1.16.0")
              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          QLEOF
          mkdir -p QemuLab/app/src/main
          cat > QemuLab/app/src/main/AndroidManifest.xml <<'QLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.QemuLab">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          QLEOF
          mkdir -p QemuLab/app/src/main/java/id/qemulab
          cat > QemuLab/app/src/main/java/id/qemulab/MainActivity.kt <<'QLEOF'
          package id.qemulab

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.enableEdgeToEdge
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.remember
          import androidx.compose.runtime.setValue
          import androidx.lifecycle.compose.collectAsStateWithLifecycle
          import androidx.lifecycle.viewmodel.compose.viewModel
          import id.qemulab.data.VmConfig
          import id.qemulab.ui.AboutDialog
          import id.qemulab.ui.ConsoleSheet
          import id.qemulab.ui.EditVmSheet
          import id.qemulab.ui.HomeScreen
          import id.qemulab.ui.QemuLabTheme

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  enableEdgeToEdge()
                  setContent { QemuLabTheme { QemuLabApp() } }
              }
          }

          @Composable
          fun QemuLabApp(vm: VmViewModel = viewModel()) {
              val vms by vm.vms.collectAsStateWithLifecycle()
              val running by vm.runner.running.collectAsStateWithLifecycle()
              val logs by vm.runner.logs.collectAsStateWithLifecycle()
              val importing by vm.importing.collectAsStateWithLifecycle()

              var editing by remember { mutableStateOf<VmConfig?>(null) }
              var consoleId by remember { mutableStateOf<String?>(null) }
              var showAbout by remember { mutableStateOf(false) }

              HomeScreen(
                  vms = vms,
                  running = running,
                  binaryOk = vm.runner::hasBinary,
                  onAdd = { editing = vm.newConfig() },
                  onEdit = { editing = it },
                  onDelete = vm::delete,
                  onStart = { vm.start(it); consoleId = it.id },
                  onStop = vm::stop,
                  onConsole = { consoleId = it.id },
                  onAbout = { showAbout = true },
              )

              if (showAbout) AboutDialog(onDismiss = { showAbout = false })

              editing?.let { cfg ->
                  EditVmSheet(
                      initial = cfg,
                      importing = importing,
                      onImport = vm::importImage,
                      onSave = { vm.save(it); editing = null },
                      onDismiss = { editing = null },
                  )
              }

              consoleId?.let { id ->
                  vms.firstOrNull { it.id == id }?.let { cfg ->
                      ConsoleSheet(
                          vm = cfg,
                          lines = logs[id].orEmpty(),
                          isRunning = id in running,
                          onStop = { vm.stop(cfg) },
                          onDismiss = { consoleId = null },
                      )
                  }
              }
          }
          QLEOF
          mkdir -p QemuLab/app/src/main/java/id/qemulab
          cat > QemuLab/app/src/main/java/id/qemulab/VmViewModel.kt <<'QLEOF'
          package id.qemulab

          import android.app.Application
          import android.net.Uri
          import android.provider.OpenableColumns
          import androidx.lifecycle.AndroidViewModel
          import androidx.lifecycle.viewModelScope
          import id.qemulab.data.VmConfig
          import id.qemulab.data.Qcow2
          import id.qemulab.data.VmStore
          import id.qemulab.qemu.QemuRunner
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow
          import kotlinx.coroutines.flow.update
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import java.io.File
          import java.io.RandomAccessFile

          class VmViewModel(app: Application) : AndroidViewModel(app) {

              private val store = VmStore(app)
              val runner = QemuRunner(app)

              private val imagesDir = File(app.filesDir, "images").apply { mkdirs() }

              private val _vms = MutableStateFlow(store.load())
              val vms: StateFlow<List<VmConfig>> = _vms.asStateFlow()

              /** Nama berkas yang sedang disalin (null bila tidak ada). */
              private val _importing = MutableStateFlow<String?>(null)
              val importing: StateFlow<String?> = _importing.asStateFlow()

              fun newConfig() = VmConfig(vncDisplay = (_vms.value.maxOfOrNull { it.vncDisplay } ?: 0) + 1)

              fun save(vm: VmConfig) {
                  viewModelScope.launch(Dispatchers.IO) {
                      var v = vm
                      if (v.diskPath.isBlank()) {
                          val f = File(imagesDir, "${v.id}.qcow2")
                          Qcow2.create(f, v.diskGb * 1024L * 1024L * 1024L)
                          v = v.copy(diskPath = f.absolutePath)
                      }
                      _vms.update { list ->
                          if (list.any { it.id == v.id }) list.map { if (it.id == v.id) v else it } else list + v
                      }
                      store.save(_vms.value)
                  }
              }

              fun delete(vm: VmConfig) {
                  runner.stop(vm.id)
                  viewModelScope.launch(Dispatchers.IO) {
                      File(vm.diskPath).delete()
                      _vms.update { list -> list.filterNot { it.id == vm.id } }
                      store.save(_vms.value)
                  }
              }

              fun start(vm: VmConfig) = runner.start(vm)
              fun stop(vm: VmConfig) = runner.stop(vm.id)

              /** Salin ISO/disk pilihan pengguna ke penyimpanan aplikasi supaya QEMU bisa membukanya lewat path. */
              fun importImage(uri: Uri, onDone: (String) -> Unit) {
                  viewModelScope.launch {
                      val resolver = getApplication<Application>().contentResolver
                      val name = withContext(Dispatchers.IO) {
                          runCatching {
                              resolver.query(uri, arrayOf(OpenableColumns.DISPLAY_NAME), null, null, null)?.use {
                                  if (it.moveToFirst()) it.getString(0) else null
                              }
                          }.getOrNull()
                      } ?: "image-${System.currentTimeMillis()}.iso"
                      _importing.value = name
                      val path = withContext(Dispatchers.IO) {
                          val out = File(imagesDir, name)
                          resolver.openInputStream(uri)?.use { input ->
                              out.outputStream().use { input.copyTo(it) }
                          }
                          out.absolutePath
                      }
                      _importing.value = null
                      onDone(path)
                  }
              }
          }
          QLEOF
          mkdir -p QemuLab/app/src/main/java/id/qemulab/data
          cat > QemuLab/app/src/main/java/id/qemulab/data/VmConfig.kt <<'QLEOF'
          package id.qemulab.data

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.nio.ByteBuffer
          import java.util.UUID

          enum class Arch(val label: String, val short: String, val binary: String) {
              X86_64("x86_64", "x86", "libqemu-system-x86_64.so"),
          }

          enum class CpuModel(val label: String, val qemuName: String) {
              QEMU32("Qemu32", "qemu32"),
              CORE2DUO("Core2Duo", "core2duo"),
              PENTIUM3("Pentium 3", "pentium3"),
          }

          enum class Accel(val label: String) { NONE("None"), TCG("TCG"), MTTCG("MTTCG") }
          enum class Gfx(val label: String) { STD("STD"), NONE("None") }
          enum class DiskBus(val label: String) { VIRTIO("VirtIO"), IDE("IDE") }
          enum class Display(val label: String) { VNC("VNC"), SDL("SDL") }
          enum class BootFrom(val label: String, val code: String) {
              DISK("Disk", "c"),
              CDROM("CD/ISO", "d"),
              NETWORK("Network", "n"),
          }

          /** Pilihan kapasitas maksimum untuk disk qcow2 baru (growable). */
          val QCOW2_SIZES_GB = listOf(1, 2, 4, 8)

          data class VmConfig(
              val id: String = UUID.randomUUID().toString(),
              val name: String = "VM baru",
              val arch: Arch = Arch.X86_64,
              val ramMb: Int = 1024,
              val cores: Int = 2,
              val diskGb: Int = 8,
              val diskPath: String = "",
              val isoPath: String = "",
              val vncDisplay: Int = 1,
              val extraArgs: String = "",
              val cpu: CpuModel = CpuModel.QEMU32,
              val accel: Accel = Accel.MTTCG,
              val gfx: Gfx = Gfx.STD,
              val diskBus: DiskBus = DiskBus.VIRTIO,
              val display: Display = Display.VNC,
              val boot: BootFrom = BootFrom.DISK,
          ) {
              val vncPort get() = 5900 + vncDisplay
          }

          /** Pembuat image qcow2 kosong (thin/growable). Layout: header, L1, refcount table, refcount block. */
          object Qcow2 {
              private const val CLUSTER_BITS = 16
              private const val CLUSTER = 1L shl CLUSTER_BITS

              fun create(file: File, sizeBytes: Long) {
                  val l2Entries = CLUSTER / 8
                  val bytesPerL1 = l2Entries * CLUSTER
                  val l1Size = ((sizeBytes + bytesPerL1 - 1) / bytesPerL1).toInt().coerceAtLeast(1)
                  val l1Offset = CLUSTER
                  val refTableOffset = 2 * CLUSTER
                  val refBlockOffset = 3 * CLUSTER

                  val buf = ByteBuffer.allocate((4 * CLUSTER).toInt())
                  buf.putInt(0, 0x514649FB)            // magic 'QFI\xfb'
                  buf.putInt(4, 2)                     // versi 2
                  buf.putLong(8, 0L)                   // backing file offset
                  buf.putInt(16, 0)                    // backing file size
                  buf.putInt(20, CLUSTER_BITS)         // cluster bits (64 KB)
                  buf.putLong(24, sizeBytes)           // ukuran virtual
                  buf.putInt(32, 0)                    // tanpa enkripsi
                  buf.putInt(36, l1Size)
                  buf.putLong(40, l1Offset)
                  buf.putLong(48, refTableOffset)
                  buf.putInt(56, 1)                    // refcount table: 1 cluster
                  buf.putInt(60, 0)                    // snapshot
                  buf.putLong(64, 0L)

                  // L1 kosong: semua cluster data belum dialokasikan (thin).
                  // Refcount table entri 0 -> refcount block.
                  buf.putLong(refTableOffset.toInt(), refBlockOffset)
                  // Refcount block: cluster 0..3 (header, L1, refcount table, refcount block) dipakai.
                  for (c in 0 until 4) {
                      buf.putShort(refBlockOffset.toInt() + c * 2, 1.toShort())
                  }
                  file.writeBytes(buf.array())
              }
          }

          private inline fun <reified T : Enum<T>> enumOr(s: String?, default: T): T =
              runCatching { enumValueOf<T>(s ?: "") }.getOrDefault(default)

          class VmStore(context: Context) {
              private val file = File(context.filesDir, "vms.json")

              fun load(): List<VmConfig> = runCatching {
                  val arr = JSONArray(file.readText())
                  List(arr.length()) { i ->
                      val o = arr.getJSONObject(i)
                      VmConfig(
                          id = o.getString("id"),
                          name = o.getString("name"),
                          arch = enumOr(o.optString("arch"), Arch.X86_64),
                          ramMb = o.getInt("ramMb").coerceIn(512, 4096),
                          cores = o.getInt("cores"),
                          diskGb = o.getInt("diskGb"),
                          diskPath = o.getString("diskPath"),
                          isoPath = o.getString("isoPath"),
                          vncDisplay = o.getInt("vncDisplay"),
                          extraArgs = o.getString("extraArgs"),
                          cpu = enumOr(o.optString("cpu"), CpuModel.QEMU32),
                          accel = enumOr(o.optString("accel"), Accel.MTTCG),
                          gfx = enumOr(o.optString("gfx"), Gfx.STD),
                          diskBus = enumOr(o.optString("diskBus"), DiskBus.VIRTIO),
                          display = enumOr(o.optString("display"), Display.VNC),
                          boot = enumOr(o.optString("boot"), BootFrom.DISK),
                      )
                  }
              }.getOrDefault(emptyList())

              fun save(list: List<VmConfig>) {
                  val arr = JSONArray()
                  list.forEach {
                      arr.put(
                          JSONObject()
                              .put("id", it.id).put("name", it.name).put("arch", it.arch.name)
                              .put("ramMb", it.ramMb).put("cores", it.cores).put("diskGb", it.diskGb)
                              .put("diskPath", it.diskPath).put("isoPath", it.isoPath)
                              .put("vncDisplay", it.vncDisplay).put("extraArgs", it.extraArgs)
                              .put("cpu", it.cpu.name).put("accel", it.accel.name)
                              .put("gfx", it.gfx.name).put("diskBus", it.diskBus.name)
                              .put("display", it.display.name).put("boot", it.boot.name)
                      )
                  }
                  file.writeText(arr.toString())
              }
          }
          QLEOF
          mkdir -p QemuLab/app/src/main/java/id/qemulab/qemu
          cat > QemuLab/app/src/main/java/id/qemulab/qemu/QemuRunner.kt <<'QLEOF'
          package id.qemulab.qemu

          import android.content.Context
          import id.qemulab.data.Accel
          import id.qemulab.data.Arch
          import id.qemulab.data.DiskBus
          import id.qemulab.data.Display
          import id.qemulab.data.Gfx
          import id.qemulab.data.VmConfig
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow
          import kotlinx.coroutines.flow.update
          import java.io.File
          import java.util.concurrent.ConcurrentHashMap
          import kotlin.concurrent.thread

          /**
           * Menjalankan binary QEMU yang dibundel sebagai library native
           * (app/src/main/jniLibs/arm64-v8a/libqemu-system-*.so).
           * Binary di nativeLibraryDir adalah satu-satunya lokasi yang boleh di-exec di Android 10+.
           */
          class QemuRunner(private val context: Context) {

              private val processes = ConcurrentHashMap<String, Process>()

              private val _running = MutableStateFlow<Set<String>>(emptySet())
              val running: StateFlow<Set<String>> = _running.asStateFlow()

              private val _logs = MutableStateFlow<Map<String, List<String>>>(emptyMap())
              val logs: StateFlow<Map<String, List<String>>> = _logs.asStateFlow()

              private val nativeDir get() = context.applicationInfo.nativeLibraryDir

              fun binaryFor(arch: Arch) = File(nativeDir, arch.binary)
              fun hasBinary(arch: Arch) = binaryFor(arch).exists()

              private fun romsDir() = File(context.filesDir, "roms")

              /** Salin ROM firmware (BIOS, VGA BIOS) dari assets ke penyimpanan app, sekali saja. */
              private fun ensureRoms() {
                  val dir = romsDir()
                  if (dir.exists() && (dir.list()?.isNotEmpty() == true)) return
                  dir.mkdirs()
                  context.assets.list("roms")?.forEach { name ->
                      context.assets.open("roms/$name").use { input ->
                          File(dir, name).outputStream().use { input.copyTo(it) }
                      }
                  }
              }

              /** Deteksi format image dari magic bytes: qcow2 atau raw. */
              private fun driveFormat(path: String): String = runCatching {
                  File(path).inputStream().use { s ->
                      val h = ByteArray(4)
                      s.read(h)
                      if (h.contentEquals(byteArrayOf(0x51, 0x46, 0x49, 0xFB.toByte()))) "qcow2" else "raw"
                  }
              }.getOrDefault("raw")

              fun buildCommand(vm: VmConfig): List<String> {
                  val a = mutableListOf(
                      binaryFor(vm.arch).absolutePath,
                      "-L", romsDir().absolutePath,
                      "-m", vm.ramMb.toString(),
                      "-smp", vm.cores.toString(),
                      "-machine", "q35",
                      "-cpu", vm.cpu.qemuName,
                      "-vga", if (vm.gfx == Gfx.STD) "std" else "none",
                      "-device", "qemu-xhci",
                      "-device", "usb-tablet",
                      "-netdev", "user,id=n0",
                      "-device", "virtio-net-pci,netdev=n0",
                      "-serial", "stdio",
                      "-monitor", "none",
                      "-vnc", "127.0.0.1:${vm.vncDisplay}",
                      "-boot", "order=${vm.boot.code}",
                  )
                  if (vm.display == Display.SDL) a += listOf("-display", "sdl")

                  val accel = when (vm.accel) {
                      Accel.NONE -> null
                      Accel.TCG -> "tcg,thread=single"
                      Accel.MTTCG -> "tcg,thread=multi"
                  }
                  if (accel != null) a += listOf("-accel", accel)

                  if (vm.diskPath.isNotBlank() && File(vm.diskPath).exists()) {
                      val iface = if (vm.diskBus == DiskBus.IDE) "ide" else "virtio"
                      a += listOf("-drive", "file=${vm.diskPath},if=$iface,format=${driveFormat(vm.diskPath)}")
                  }
                  if (vm.isoPath.isNotBlank() && File(vm.isoPath).exists()) {
                      a += listOf("-cdrom", vm.isoPath)
                  }
                  a += vm.extraArgs.trim().split(Regex("\\s+")).filter { it.isNotBlank() }
                  return a
              }

              fun start(vm: VmConfig) {
                  if (processes.containsKey(vm.id)) return
                  _logs.update { it + (vm.id to emptyList()) }

                  val bin = binaryFor(vm.arch)
                  if (!bin.exists()) {
                      log(vm.id, "✗ Binary ${bin.name} tidak ditemukan.")
                      log(vm.id, "  Taruh di app/src/main/jniLibs/arm64-v8a/ lalu build ulang (lihat README).")
                      return
                  }
                  ensureRoms()
                  val cmd = buildCommand(vm)
                  log(vm.id, "$ " + cmd.joinToString(" "))
                  log(vm.id, "VNC: 127.0.0.1:${vm.vncPort}")
                  try {
                      val pb = ProcessBuilder(cmd).redirectErrorStream(true)
                      pb.environment()["LD_LIBRARY_PATH"] = nativeDir
                      pb.directory(context.filesDir)
                      val p = pb.start()
                      processes[vm.id] = p
                      _running.update { it + vm.id }
                      thread(name = "qemu-${vm.id.take(6)}", isDaemon = true) {
                          p.inputStream.bufferedReader().forEachLine { log(vm.id, it) }
                          val code = p.waitFor()
                          log(vm.id, "— proses berhenti (kode $code)")
                          processes.remove(vm.id)
                          _running.update { it - vm.id }
                      }
                  } catch (e: Exception) {
                      log(vm.id, "✗ Gagal menjalankan: ${e.message}")
                  }
              }

              fun stop(id: String) {
                  val p = processes[id] ?: return
                  p.destroy()
                  thread(isDaemon = true) {
                      Thread.sleep(2000)
                      if (p.isAlive) p.destroyForcibly()
                  }
              }

              private fun log(id: String, line: String) {
                  _logs.update { m -> m + (id to (m[id].orEmpty() + line).takeLast(500)) }
              }
          }
          QLEOF
          mkdir -p QemuLab/app/src/main/java/id/qemulab/ui
          cat > QemuLab/app/src/main/java/id/qemulab/ui/ConsoleSheet.kt <<'QLEOF'
          package id.qemulab.ui

          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.Arrangement
          import androidx.compose.foundation.layout.Column
          import androidx.compose.foundation.layout.Row
          import androidx.compose.foundation.layout.fillMaxWidth
