          import id.qemulab.data.DiskBus
          import id.qemulab.data.Display
          import id.qemulab.data.Gfx
          import id.qemulab.data.QCOW2_SIZES_GB
          import id.qemulab.data.VmConfig
          import java.io.File
          import kotlin.math.roundToInt

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun EditVmSheet(
              initial: VmConfig,
              importing: String?,
              onImport: (Uri, (String) -> Unit) -> Unit,
              onSave: (VmConfig) -> Unit,
              onDismiss: () -> Unit,
          ) {
              var draft by remember { mutableStateOf(initial) }
              val isNew = initial.diskPath.isBlank()

              val isoPicker = rememberLauncherForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->
                  if (uri != null) onImport(uri) { path -> draft = draft.copy(isoPath = path) }
              }
              val diskPicker = rememberLauncherForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->
                  if (uri != null) onImport(uri) { path -> draft = draft.copy(diskPath = path) }
              }

              ModalBottomSheet(
                  onDismissRequest = onDismiss,
                  sheetState = rememberModalBottomSheetState(skipPartiallyExpanded = true),
              ) {
                  Column(
                      Modifier
                          .verticalScroll(rememberScrollState())
                          .padding(horizontal = 24.dp)
                          .padding(bottom = 32.dp),
                      verticalArrangement = Arrangement.spacedBy(16.dp),
                  ) {
                      Text(
                          if (isNew) "VM baru" else "Ubah VM",
                          style = MaterialTheme.typography.headlineMedium,
                      )

                      OutlinedTextField(
                          value = draft.name,
                          onValueChange = { draft = draft.copy(name = it) },
                          label = { Text("Nama") },
                          singleLine = true,
                          modifier = Modifier.fillMaxWidth(),
                      )

                      ChoiceRow("CPU (model)", CpuModel.entries.toList(), draft.cpu, { it.label }) {
                          draft = draft.copy(cpu = it)
                      }

                      LabeledSlider("RAM", "${draft.ramMb} MB", draft.ramMb.toFloat(), 512f..4096f) {
                          draft = draft.copy(ramMb = ((it / 256f).roundToInt() * 256).coerceIn(512, 4096))
                      }
                      LabeledSlider("Jumlah core", "${draft.cores} core", draft.cores.toFloat(), 1f..8f) {
                          draft = draft.copy(cores = it.roundToInt().coerceIn(1, 8))
                      }

                      ChoiceRow("Akselerasi", Accel.entries.toList(), draft.accel, { it.label }) {
                          draft = draft.copy(accel = it)
                      }
                      ChoiceRow("Grafis", Gfx.entries.toList(), draft.gfx, { it.label }) {
                          draft = draft.copy(gfx = it)
                      }
                      ChoiceRow("Display", Display.entries.toList(), draft.display, { it.label }) {
                          draft = draft.copy(display = it)
                      }

                      Text("Disk", style = MaterialTheme.typography.titleSmall)
                      if (isNew) {
                          if (draft.diskPath.isBlank()) {
                              ChoiceRow("Add Qcow2 (growable)", QCOW2_SIZES_GB, draft.diskGb, { "$it GB" }) {
                                  draft = draft.copy(diskGb = it)
                              }
                              OutlinedButton(
                                  onClick = { diskPicker.launch(arrayOf("*/*")) },
                                  enabled = importing == null,
                                  modifier = Modifier.fillMaxWidth(),
                              ) { Text("Pilih Disk…") }
                          } else {
                              Text(
                                  "Disk dipilih: ${File(draft.diskPath).name}",
                                  style = MaterialTheme.typography.bodyMedium,
                              )
                              OutlinedButton(
                                  onClick = { draft = draft.copy(diskPath = "") },
                                  modifier = Modifier.fillMaxWidth(),
                              ) { Text("Kembali ke Add Qcow2") }
                          }
                      } else {
                          Text(
                              "Disk: ${File(draft.diskPath).name} (tetap)",
                              style = MaterialTheme.typography.bodyMedium,
                              color = MaterialTheme.colorScheme.onSurfaceVariant,
                          )
                      }
                      if (importing != null) {
                          Text("Menyalin $importing…", style = MaterialTheme.typography.bodySmall)
                          LinearProgressIndicator(Modifier.fillMaxWidth())
                      }

                      ChoiceRow("Bus disk", DiskBus.entries.toList(), draft.diskBus, { it.label }) {
                          draft = draft.copy(diskBus = it)
                      }
                      ChoiceRow("Boot dari", BootFrom.entries.toList(), draft.boot, { it.label }) {
                          draft = draft.copy(boot = it)
                      }

                      Text("Image ISO", style = MaterialTheme.typography.titleSmall)
                      OutlinedButton(
                          onClick = { isoPicker.launch(arrayOf("*/*")) },
                          enabled = importing == null,
                          modifier = Modifier.fillMaxWidth(),
                      ) {
                          Text(
                              if (draft.isoPath.isBlank()) "Pilih berkas ISO…"
                              else File(draft.isoPath).name
                          )
                      }

                      OutlinedTextField(
                          value = draft.extraArgs,
                          onValueChange = { draft = draft.copy(extraArgs = it) },
                          label = { Text("Argumen QEMU tambahan") },
                          supportingText = { Text("Contoh: -device virtio-rng-pci") },
                          modifier = Modifier.fillMaxWidth(),
                      )

                      Spacer(Modifier.height(4.dp))
                      Button(
                          onClick = { onSave(draft) },
                          enabled = draft.name.isNotBlank() && importing == null,
                          modifier = Modifier.fillMaxWidth().height(56.dp),
                      ) { Text(if (isNew) "Buat VM" else "Simpan") }
                  }
              }
          }

          @Composable
          private fun <T> ChoiceRow(
              label: String,
              options: List<T>,
              selected: T,
              name: (T) -> String,
              onSelect: (T) -> Unit,
          ) {
              Text(label, style = MaterialTheme.typography.titleSmall)
              SingleChoiceSegmentedButtonRow(Modifier.fillMaxWidth()) {
                  options.forEachIndexed { i, o ->
                      SegmentedButton(
                          selected = o == selected,
                          onClick = { onSelect(o) },
                          shape = SegmentedButtonDefaults.itemShape(i, options.size),
                      ) { Text(name(o)) }
                  }
              }
          }

          @Composable
          private fun LabeledSlider(
              label: String,
              value: String,
              current: Float,
              range: ClosedFloatingPointRange<Float>,
              onChange: (Float) -> Unit,
          ) {
              Column {
                  Row(Modifier.fillMaxWidth(), Arrangement.SpaceBetween) {
                      Text(label, style = MaterialTheme.typography.titleSmall)
                      Text(value, style = MaterialTheme.typography.titleSmall, color = MaterialTheme.colorScheme.primary)
                  }
                  Slider(value = current, onValueChange = onChange, valueRange = range)
              }
          }
