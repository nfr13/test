      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Pasang binary QEMU (opsional)
        env:
          QEMU_ZIP_URL: ${{ vars.QEMU_ZIP_URL }}
        run: |
          set -e
          DEST=QemuLab/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$DEST"
          if [ -z "$QEMU_ZIP_URL" ]; then
            echo "::warning::QEMU_ZIP_URL belum diset. APK dibuat tanpa binary QEMU."
            exit 0
          fi
          curl -fL -o qemu.zip "$QEMU_ZIP_URL"
          unzip -o -j qemu.zip 'lib*.so' -d "$DEST"
          mkdir -p QemuLab/app/src/main/assets
          unzip -o qemu.zip 'roms/*' -d QemuLab/app/src/main/assets
          ls -la "$DEST"
      - name: Build debug APK
        run: |
          cd QemuLab
          gradle assembleDebug --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: QemuLab-debug-apk
          path: "QemuLab/app/build/outputs/apk/debug/*.apk"
