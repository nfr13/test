          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun ConsoleSheet(
              vm: VmConfig,
              lines: List<String>,
              isRunning: Boolean,
              onStop: () -> Unit,
              onDismiss: () -> Unit,
          ) {
              val state = rememberLazyListState()
              LaunchedEffect(lines.size) {
                  if (lines.isNotEmpty()) state.animateScrollToItem(lines.lastIndex)
              }

              ModalBottomSheet(
                  onDismissRequest = onDismiss,
                  sheetState = rememberModalBottomSheetState(skipPartiallyExpanded = true),
              ) {
                  Column(Modifier.padding(horizontal = 24.dp).padding(bottom = 24.dp)) {
                      Row(
                          Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically,
                      ) {
                          Column {
                              Text(vm.name, style = MaterialTheme.typography.headlineSmall)
                              Text(
                                  if (isRunning) "Berjalan · VNC 127.0.0.1:${vm.vncPort}" else "Berhenti",
                                  style = MaterialTheme.typography.bodyMedium,
                                  color = if (isRunning) MaterialTheme.colorScheme.primary
                                  else MaterialTheme.colorScheme.onSurfaceVariant,
                              )
                          }
                          if (isRunning) FilledTonalButton(onClick = onStop) { Text("Hentikan") }
                      }

                      LazyColumn(
                          state = state,
                          modifier = Modifier
                              .padding(top = 16.dp)
                              .fillMaxWidth()
                              .height(420.dp)
                              .clip(RoundedCornerShape(24.dp))
                              .background(MaterialTheme.colorScheme.surfaceContainerHighest)
                              .padding(16.dp),
                      ) {
                          itemsIndexed(lines) { _, line ->
                              Text(
                                  line,
                                  fontFamily = FontFamily.Monospace,
                                  fontSize = 12.sp,
                                  lineHeight = 16.sp,
                                  color = MaterialTheme.colorScheme.onSurface,
                              )
                          }
                      }
                  }
              }
          }
